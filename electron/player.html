<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F1 OpenViewer – Player</title>
  <link rel="stylesheet" href="../node_modules/shaka-player/dist/controls.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0f14;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #video-container {
      position: absolute;
      inset: 0;
      background: #000;
    }
    #video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
    #status {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 10px 14px;
      font-size: 13px;
      background: rgba(22, 27, 34, 0.92);
      border-top: 1px solid #21262d;
      color: #8b949e;
      pointer-events: none;
    }
    #status.error { color: #f85149; }
    #status.ready { color: #3fb950; }
  </style>
  <script src="../node_modules/shaka-player/dist/shaka-player.ui.js"></script>
</head>
<body>
  <div id="container">
    <div id="video-container">
      <video id="video" controls autoplay></video>
    </div>
    <div id="status" aria-live="polite">Waiting for stream…</div>
  </div>
  <script src="player-renderer.js"></script>
</body>
</html>
